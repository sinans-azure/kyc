<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinan Banking Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <h1>Sinan Banking</h1>
      <p>Demo Environment</p>
    </div>
    <nav class="nav">
      <button id="nav-dashboard" class="nav-btn">Dashboard</button>
      <button id="nav-insurance" class="nav-btn">Insurance</button>
      <button id="nav-login" class="nav-btn active">Login</button>
    </nav>
  </header>

  <main class="container">
    <section id="login-screen" class="screen active">
      <h2>Sign in</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" value="demo@bank.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" value="Password123" required />
        </div>
        <button type="submit" class="btn primary">Login</button>
        <p class="hint">Use demo@bank.com / Password123</p>
      </form>
    </section>

    <section id="dashboard-screen" class="screen">
      <div class="welcome-banner">
        <h2 id="user-name">Welcome</h2>
        <p id="insurance-status">Sign in to view account data.</p>
      </div>

      <div class="dashboard-grid">
        <div class="widget">
          <h3>Accounts</h3>
          <div id="account-list" class="list"></div>
        </div>
        <div class="widget">
          <h3>Recent Transactions</h3>
          <div id="transaction-list" class="list"></div>
        </div>
      </div>
    </section>

    <section id="insurance-screen" class="screen">
      <div class="dashboard-grid">
        <div class="widget">
          <h3>Request Insurance</h3>
          <form id="insurance-form">
            <div class="form-group">
              <label for="insurance-fullname">Full Name</label>
              <input id="insurance-fullname" type="text" required />
            </div>
            <div class="form-group">
              <label for="insurance-email">Email</label>
              <input id="insurance-email" type="email" required />
            </div>
            <div class="form-group">
              <label for="insurance-document">Identity Document</label>
              <input id="insurance-document" type="file" accept=".pdf,.png,.jpg,.jpeg" required />
            </div>
            <button type="submit" class="btn primary">Submit Request</button>
            <div id="insurance-result" class="result-msg"></div>
          </form>
        </div>
        <div class="widget">
          <h3>Your Requests</h3>
          <div id="insurance-list" class="list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
